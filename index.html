<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>typespeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

     <!-- TOP CONFIG BAR -->
    <header class="topbar">
      <div class="bar-group toggles">
        <button class="toggle-btn" id="punctuationBtn" data-toggle="punctuation">
          <span class="icon">@</span> punctuation
        </button>
        <button class="toggle-btn" id="numbersBtn" data-toggle="numbers">
          <span class="icon">#</span> numbers
        </button>
      </div>

      <div class="bar-group modes">
        <button class="mode-btn active" data-mode="time">
          <span class="icon">⏱</span> time
        </button>
        <button class="mode-btn" data-mode="words">
          <span class="icon">A</span> words
        </button>
        <button class="mode-btn" data-mode="quote">
          <span class="icon">"</span> quote
        </button>
        <button class="mode-btn" data-mode="zen">
          <span class="icon">△</span> zen
        </button>
        <button class="mode-btn" data-mode="custom">
          <span class="icon">🔧</span> custom
        </button>
      </div>

      <div class="bar-group amounts" id="amountsGroup">
        <!-- filled dynamically by JS depending on mode -->
      </div>

      <button class="settings-btn" title="settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

     <!-- LANGUAGE INDICATOR -->
    <div class="lang-row">
      <button class="lang-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/></svg>
        english
      </button>
    </div>

    <!-- LIVE STATS (timer / word count while typing) -->
    <div class="live-stats" id="liveStats"></div>

    <!-- TYPING AREA -->
    <main class="type-area" id="typeArea">
      <div class="words-wrapper" id="wordsWrapper">
        <div class="words" id="words" tabindex="0"></div>
      </div>
    </main>

    <!-- HIDDEN INPUT TO CAPTURE KEYSTROKES ON MOBILE -->
    <input type="text" id="hiddenInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <!-- RESTART -->
    <div class="restart-row">
      <button class="restart-btn" id="restartBtn" title="restart test">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
      </button>
    </div>

     <!-- RESULTS CARD -->
    <section class="results-overlay" id="resultsOverlay">
      <div class="results-card">
        <div class="results-main">
          <div class="stat big">
            <div class="stat-label">wpm</div>
            <div class="stat-value" id="resWpm">0</div>
          </div>
          <div class="stat big">
            <div class="stat-label">acc</div>
            <div class="stat-value" id="resAcc">0%</div>
          </div>
        </div>
        <div class="results-secondary">
          <div class="stat small">
            <div class="stat-label">raw</div>
            <div class="stat-value" id="resRaw">0</div>
          </div>
          <div class="stat small">
            <div class="stat-label">characters</div>
            <div class="stat-value" id="resChars">0/0/0/0</div>
          </div>
          <div class="stat small">
            <div class="stat-label">time</div>
            <div class="stat-value" id="resTime">0s</div>
          </div>
          <div class="stat small">
            <div class="stat-label">mode</div>
            <div class="stat-value" id="resMode">time 15</div>
          </div>
        </div>
        <button class="next-test-btn" id="nextTestBtn" title="next test">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
          </svg>
          next test
        </button>
      </div>
    </section>

  </div>


    

<script src="script.js"></script>
</body>
</html>
